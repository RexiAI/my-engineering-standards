name: Security Scan

on:
  workflow_call:
    inputs:
      codeql-enabled:
        description: Enable CodeQL SAST analysis
        default: true
        type: boolean
      trivy-enabled:
        description: Enable Trivy filesystem scan
        default: true
        type: boolean
      trivy-severity:
        description: Minimum severity for Trivy (CRITICAL,HIGH,MEDIUM)
        default: CRITICAL,HIGH
        type: string
    secrets:
      GHCR_TOKEN:
        description: GitHub Container Registry token
        required: false

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL SAST
    if: inputs.codeql-enabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  trivy:
    name: Trivy Filesystem Scan
    if: inputs.trivy-enabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy-severity }}
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
