name: CI - Java

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version
        default: "21"
        type: string
      maven-verify-goal:
        description: Maven goal for full verification
        default: verify
        type: string
      deploy-on-main:
        description: Deploy artifacts when merging to main
        default: true
        type: boolean
      docker-registry:
        description: Container registry host
        default: ghcr.io
        type: string
      docker-image-name:
        description: Docker image name (defaults to repo name)
        default: ""
        type: string
      sonar-enabled:
        description: Enable SonarQube analysis
        default: false
        type: boolean
      sonar-host-url:
        description: SonarQube server URL
        default: ""
        type: string
    secrets:
      PACT_BROKER_URL:
        description: Pact Broker URL for contract tests
        required: false
      MAVEN_USERNAME:
        description: Maven/GitHub Packages username
        required: false
      MAVEN_PASSWORD:
        description: Maven/GitHub Packages token
        required: false
      GHCR_TOKEN:
        description: GitHub Container Registry token
        required: false
      SONAR_TOKEN:
        description: SonarQube token
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ inputs.java-version }}
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - run: mvn test -B

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: mvn compile checkstyle:check -B
        continue-on-error: true

  contract-test:
    name: Contract Tests
    needs: [unit-test, lint]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: mvn pact:verify -B 2>/dev/null || echo "No contract tests configured"
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}

  integration-test:
    name: Integration Tests
    needs: [contract-test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: mvn ${{ inputs.maven-verify-goal }} -B -DskipITs=false -DskipTests

  sonar:
    name: SonarQube Analysis
    needs: [unit-test, integration-test]
    if: github.event_name == 'pull_request' && inputs.sonar-enabled && secrets.SONAR_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: mvn sonar:sonar -B -Dsonar.host.url=${{ inputs.sonar-host-url }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy to GitHub Packages
    needs: [unit-test, lint, contract-test, integration-test]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && inputs.deploy-on-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ inputs.java-version }}
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - run: mvn clean deploy -B -DskipTests -DskipITs
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

  docker:
    name: Docker Build & Push
    needs: [unit-test, lint, contract-test, integration-test]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.docker-registry }}/${{ github.repository }}/${{ inputs.docker-image-name || github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
