name: CI - Node.js

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version. Ignored if node-version-file is set. Kept for backward compat with consumers that don't have an .nvmrc yet.
        default: "22"
        type: string
      node-version-file:
        description: Path to the file declaring the Node version (e.g. .nvmrc). Takes priority over node-version when set — new consumers should set this instead of pinning a version here.
        default: ""
        type: string
      deploy-on-main:
        description: Publish package + push image when merging to main
        default: true
        type: boolean
      docker-registry:
        description: Container registry host
        default: ghcr.io
        type: string
      docker-image-name:
        description: Docker image name (defaults to repo name)
        default: ""
        type: string
    secrets:
      PACT_BROKER_URL:
        description: Pact Broker URL for contract tests
        required: false
      NPM_TOKEN:
        description: npm/GitHub Packages token
        required: false
      GHCR_TOKEN:
        description: GitHub Container Registry token
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npm test -- --passWithNoTests 2>/dev/null || npm run test:unit --if-present || npm test

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run format:check --if-present

  contract-test:
    name: Contract Tests
    needs: [unit-test, lint]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npx jest test/pact --ci --forceExit 2>/dev/null || npm run test:pact --if-present || echo "No contract tests configured"
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}

  integration-test:
    name: Integration Tests
    needs: [contract-test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration --if-present

  deploy:
    name: Publish Package
    needs: [unit-test, lint, contract-test, integration-test]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && inputs.deploy-on-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: https://npm.pkg.github.com
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Docker Build & Push
    needs: [unit-test, lint, contract-test, integration-test]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.docker-registry }}/${{ github.repository }}/${{ inputs.docker-image-name || github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
