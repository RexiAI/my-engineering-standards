name: PR Review Agent

# Shared PR review workflow (spec 024, hardened spec 026): run the pr-review
# agent headless against a PR and post findings as a review comment. Review +
# suggest fixes only — the agent's permission block (agents/pr-review.md)
# denies edits and this workflow grants no write capability beyond posting a
# comment. Comment-only by construction: no repo-content write, no merge, no
# push step anywhere in this file. The permission block is loaded for real:
# the review step invokes `opencode run --agent pr-review`, not a
# string-concatenated prompt with the frontmatter stripped out (spec 026,
# AC-026-02 — see the review step's comments for what that used to do wrong).
#
# Consumers (child repos via init-ci.sh --with-pr-review, and this repo's own
# .github/workflows/pr-review.yml) call this with pr-number + head-sha. The
# API key secret is optional: a caller without the key gets a skipped job,
# never a failure.

on:
  workflow_call:
    inputs:
      pr-number:
        description: Pull request number to review
        required: true
        type: number
      head-sha:
        description: Head commit SHA of the pull request to review
        required: true
        type: string
    secrets:
      OPENCODE_API_KEY:
        description: API key for the provider serving the review model
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      PR_NUMBER: ${{ inputs.pr-number }}
      HEAD_SHA: ${{ inputs.head-sha }}
      # Optional override for the review run's model: the repo-level
      # Actions variable PR_REVIEW_MODEL (provider-qualified; bare ids fail
      # with "Model not found"). When unset, opencode.json's
      # {env:SPEC_PR_REVIEW_MODEL} resolves against the committed default in
      # config/model.local.env.example — same chain as every other agent.
      PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          # The calling repository, including its .standards submodule (child
          # repos resolve the agent from .standards/agents/). No credentials in
          # the working tree: the reviewer never pushes, and gh uses the
          # workflow's GITHUB_TOKEN rather than git credentials.
          submodules: true
          persist-credentials: false

      - name: Install pinned opencode binary
        run: |
          set -euo pipefail
          # Pin lives in scripts/install-opencode.sh — shared with self-ci and
          # ci-sweeper so every workflow runs the same opencode release.
          bash scripts/install-opencode.sh

      - name: Make the pr-review agent discoverable to opencode
        run: |
          set -euo pipefail
          mkdir -p .opencode/agents
          if [ -f agents/pr-review.md ]; then
            ln -sfn ../../agents/pr-review.md .opencode/agents/pr-review.md
          elif [ -f .standards/agents/pr-review.md ]; then
            ln -sfn ../../.standards/agents/pr-review.md .opencode/agents/pr-review.md
          else
            echo "pr-review agent not found (checked agents/pr-review.md and .standards/agents/pr-review.md)" >&2
            exit 1
          fi

      # Debounce + early-exit (spec 024): skip the model run when this head was
      # already reviewed (Reviewed-SHA: marker from a prior comment) and every
      # CI check for the head passes or was skipped (skipped jobs are not
      # failures — a skipped run must not re-trigger the review on the next
      # event). The run proceeds when the head changed or any check fails,
      # errors, or is pending. Any gh read failure (e.g. restricted token) is
      # treated as "not all green" — conservative, never a silent skip.
      - name: Early exit when head already reviewed and CI green
        id: early-exit
        run: |
          set -euo pipefail
          reviewed_sha=""
          while IFS= read -r line; do
            case "$line" in
              Reviewed-SHA:*)
                reviewed_sha="${line#Reviewed-SHA: }"
                ;;
            esac
          done < <(gh pr view "${PR_NUMBER}" --json comments --jq '.comments[].body' 2>/dev/null || true)
          skip="false"
          if [ -n "$reviewed_sha" ] && [ "$reviewed_sha" = "${HEAD_SHA}" ]; then
            if gh pr checks "${PR_NUMBER}" --json state --jq 'all(.state == "SUCCESS" or .state == "SKIPPED")' >/dev/null 2>&1; then
              echo "Head ${HEAD_SHA} already reviewed and all CI checks green — skipping the model run."
              skip="true"
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Review the PR with the pr-review agent
        # Empty-key guard (AC-024-02-03): an absent key yields a skipped step,
        # never a failure — the PR's required checks are unaffected. secrets is
        # not a legal context in an if: at any scope, so gate on the job env
        # (the secret is mapped into the env in the job env block).
        # Empty-model guard (ADR 0003): when PR_REVIEW_MODEL is unset, the
        # step skips too — a repo opts in by configuring BOTH the key and the
        # model; neither has a shipped default.
        if: ${{ steps.early-exit.outputs.skip != 'true' && env.OPENCODE_API_KEY != '' }}
        run: |
          set -euo pipefail
          # Headless run on a bare runner has no shell profile, so load the
          # committed defaults for the {env:SPEC_*_MODEL} references in
          # opencode.json explicitly with the dotenv-equivalent (the same
          # effect as the .envrc's first dotenv_if_exists line, and the same
          # pattern as ci-sweeper.yml). No permission auto-approval flag is
          # passed: the review is comment-only and the agent's permission
          # block enforces that.
          # shellcheck disable=SC1091
          set -a; . config/model.local.env.example; set +a

          # Model override: when PR_REVIEW_MODEL is set in the caller's
          # environment, export it as SPEC_PR_REVIEW_MODEL so opencode.json's
          # {env:SPEC_PR_REVIEW_MODEL} resolves to the override value instead
          # of the committed default. The step's if: guarantees the variable
          # is set here — there is no shipped fallback model.
          if [ -n "${PR_REVIEW_MODEL:-}" ]; then
            export SPEC_PR_REVIEW_MODEL="$PR_REVIEW_MODEL"
          fi

          # Billing/quota guard: capture output so we can detect provider
          # errors (spending limit, quota, rate limit) and skip gracefully.
          # A billing issue is not a code defect — fail the step only if the
          # error is something else.
          #
          # AC-026-02: invoke the agent by name (`--agent pr-review`), not by
          # catting agents/pr-review.md into a plain prompt string. The old
          # approach required stripping the frontmatter with
          # `sed '/^---$/,/^---$/d'` to avoid feeding YAML into the prompt —
          # which silently deleted the entire `permission` block before
          # opencode ever saw it, so `edit: deny` and the bash allowlist were
          # enforced in the committed file but NOT in the actual CI run. The
          # agent's mode is `primary` (agents/pr-review.md) specifically so
          # `--agent` is accepted here and the real permission block loads.
          #
          # The subshell + set +e wrapper is required because set -euo
          # pipefail (above) would exit the script before review_rc=$?
          # is reached when opencode returns non-zero.
          # The task prompt carries only trusted, workflow-supplied values
          # (PR number, head SHA) — never PR-author-controlled content. The
          # agent fetches the diff itself via its own allow-listed `gh`/`git`
          # commands and is instructed (agents/pr-review.md §Untrusted content
          # warning) to treat that content as data, never as instructions.
          prompt="Review PR ${PR_NUMBER} at head ${HEAD_SHA}. Post your findings as one PR review comment via gh. End the comment with: Reviewed-SHA: ${HEAD_SHA}"

          review_output=$(set +e; /tmp/opencode-bin/opencode run --print-logs \
            --agent pr-review \
            "${prompt}" 2>&1) && review_rc=0 || review_rc=$?

          if [ "$review_rc" -ne 0 ]; then
            if echo "$review_output" | sed 's/\x1b\[[0-9;]*m//g' | grep -qiE 'spending limit|quota exceeded|billing|rate.limit|429|402|insufficient balance'; then
              echo "::warning::Review skipped — billing/quota error from model provider (exit ${review_rc}). Not a code defect."
              exit 0
            fi
            echo "$review_output"
            exit "$review_rc"
          fi

          echo "$review_output"
