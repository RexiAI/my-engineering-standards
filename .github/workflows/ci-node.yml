name: CI - Node.js

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version. Ignored if node-version-file is set. Kept for backward compat with consumers that don't have an .nvmrc yet.
        default: "22"
        type: string
      node-version-file:
        description: Path to the file declaring the Node version (e.g. .nvmrc). Takes priority over node-version when set — new consumers should set this instead of pinning a version here.
        default: ""
        type: string
      deploy-on-main:
        description: Publish package + push image when merging to main
        default: true
        type: boolean
      docker-registry:
        description: Container registry host
        default: ghcr.io
        type: string
      docker-image-name:
        description: Docker image name (defaults to repo name)
        default: ""
        type: string
    secrets:
      PACT_BROKER_URL:
        description: Pact Broker URL for contract tests
        required: false
      NPM_TOKEN:
        description: npm/GitHub Packages token
        required: false
      GHCR_TOKEN:
        description: GitHub Container Registry token
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      # Consumer repos carry this standards repo as a `.standards/` submodule,
      # and many tests shell out to `.standards/scripts/*.sh`. actions/checkout's
      # own `submodules:` option cannot be used here: consumers register the
      # submodule with an SSH URL (git@github.com:…), which needs a deploy key
      # the runner does not have. Rewriting the scp-style URL to an HTTPS URL
      # carrying `github.token` lets `git submodule update` authenticate instead.
      # `contents: read` (workflow-level) already covers that token. Consumers
      # with no `.gitmodules` skip the step entirely.
      - name: Checkout submodules
        if: ${{ hashFiles('.gitmodules') != '' }}
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      # Deterministic selection, no `||` fallback chain: a failing suite must
      # fail the job. The previous chain (`npm test … 2>/dev/null || npm run
      # test:unit --if-present || npm test`) reported green with failing tests —
      # the first branch's stderr was discarded, and the second exits 0 when the
      # script does not exist. Exactly one script runs; if neither is defined,
      # that is a configuration error, not a skip.
      - name: Unit tests
        run: |
          if [ "$(npm pkg get scripts.test)" != "{}" ]; then
            npm test -- --passWithNoTests
          elif [ "$(npm pkg get scripts.test:unit)" != "{}" ]; then
            npm run test:unit
          else
            echo "::error::No test script defined (expected scripts.test or scripts.test:unit)"
            exit 1
          fi

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run format:check --if-present

  contract-test:
    name: Contract Tests
    needs: [unit-test, lint]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      # Same submodule init as unit-test (see the comment there): pact suites
      # and their provider-verification helpers live beside the consumer tests
      # and shell out to the `.standards/` scripts.
      - name: Checkout submodules
        if: ${{ hashFiles('.gitmodules') != '' }}
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      # Explicit existence check, no `|| … || echo` chain: the previous form
      # swallowed a genuine pact failure behind "No contract tests configured"
      # (the `echo` branch always exits 0). Only a repo with *no* pact script
      # and *no* pact suite/config skips; a suite that exists and fails, fails.
      - name: Contract tests (optional stage — skipped only when no pact suite exists)
        run: |
          if [ "$(npm pkg get scripts.test:pact)" != "{}" ]; then
            npm run test:pact
          elif [ -d test/pact ] || compgen -G 'pact.config.*' > /dev/null; then
            npx jest test/pact --ci --forceExit
          else
            echo "No contract tests configured (no scripts.test:pact, no test/pact suite, no pact.config.*) — skipping"
          fi
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}

  integration-test:
    name: Integration Tests
    needs: [contract-test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      # Same submodule init as unit-test (see the comment there).
      - name: Checkout submodules
        if: ${{ hashFiles('.gitmodules') != '' }}
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      # `--if-present` is a legitimate optional-stage skip here (most consumers
      # have no integration suite), but the step is named so the skip is visible
      # in the job log instead of looking like a test run that passed.
      - name: Integration tests (optional stage — skipped when no test:integration script)
        run: npm run test:integration --if-present

  deploy:
    name: Publish Package
    needs: [unit-test, lint, contract-test, integration-test]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && inputs.deploy-on-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: https://npm.pkg.github.com
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Docker Build & Push
    needs: [unit-test, lint, contract-test, integration-test]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.9.0
        with:
          images: ${{ inputs.docker-registry }}/${{ github.repository }}/${{ inputs.docker-image-name || github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.1
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
