name: Self CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:

    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      # v1.4.0 committed CRLF into 84 files (renormalization run with
      # core.autocrlf=true and an incomplete .gitattributes). bash -n and
      # PyYAML both tolerate CRLF, so neither job below would have caught
      # it. Check committed blobs directly, bypassing any local
      # core.autocrlf smudging.
      - name: Check for CRLF in committed blobs
        run: |
          errors=0
          while IFS= read -r f; do
            sha=$(git ls-files -s -- "$f" | awk '{print $2}')
            [ -z "$sha" ] && continue
            if git cat-file blob "$sha" | grep -qU $'\r$'; then
              echo "  [CRLF] $f"
              errors=$((errors + 1))
            fi
          done < <(git ls-files)
          if [ "$errors" -ne 0 ]; then
            echo "$errors file(s) have CRLF line endings in the committed blob!"
            exit 1
          fi

      - name: Check shell scripts parse (bash -n)
        run: |
          errors=0
          while IFS= read -r -d '' f; do
            if bash -n "$f"; then
              echo "  [OK] $f"
            else
              echo "  [FAIL] $f"
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          if [ "$errors" -ne 0 ]; then
            echo "$errors script(s) failed to parse!"
            exit 1
          fi

      - name: make validate-all
        run: make validate-all

      - name: Check orchestration references
        run: ./scripts/check-orchestration.sh

      - name: Check skills specification
        run: ./scripts/check-skills.sh

      # Finished-spec gate (docs/SPEC_PIPELINE.md §Archive in the PR): a spec
      # with a 30-report.md must be archived (docs/changes/NNN-slug.md) inside
      # its PR. No continue-on-error: a finished spec that would land scratch
      # on main fails the job.
      - name: Check finished specs are archived
        run: ./scripts/check-specs-archived.sh

      - name: make lint
        run: make lint

      # Model-config gate (docs/SPEC_PIPELINE.md §Model configuration): the
      # hermetic check + selftest need no binary; the runtime check proves real
      # {env:SPEC_*_MODEL} resolution with the pinned opencode release. No
      # continue-on-error: a loader/gate/wiring regression fails the job.
      - name: Install pinned opencode binary and verify model env resolution
        run: |
          set -euo pipefail
          # Extract into its own dir: running a binary at /tmp/opencode makes
          # opencode try to mkdir its storage dir at the same path → EEXIST.
          mkdir -p /tmp/opencode-bin
          curl -sSL -o /tmp/opencode-bin/opencode-linux-x64.tar.gz https://github.com/anomalyco/opencode/releases/download/v1.18.18/opencode-linux-x64.tar.gz
          tar -xzf /tmp/opencode-bin/opencode-linux-x64.tar.gz -C /tmp/opencode-bin
          /tmp/opencode-bin/opencode --version
          bash scripts/check-model-env.sh
          bash scripts/model-env.selftest.sh
          bash scripts/model-env.runtime-check.sh /tmp/opencode-bin/opencode

      - name: Run loop files check
        run: ./scripts/check-loop-files.sh

      # PR Babysitter loop gate (spec 018): the check script doubles as the
      # spec's test carrier, so a missing deliverable fails the Validate job.
      - name: Check PR Babysitter loop deliverables
        run: ./scripts/check-pr-babysitter.sh

      - name: Install shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: shellcheck scripts and templates
        continue-on-error: true
        run: |
          shellcheck scripts/*.sh templates/*.sh

      # Note: this intentionally mirrors `make lint`'s YAML scope (.github + ci),
      # not full-repo. Expanding scope belongs in the Makefile, not here.
      - name: Validate YAML syntax (.github, ci)
        run: |
          errors=0
          while IFS= read -r -d '' f; do
            if python3 -c "import yaml; yaml.safe_load(open('$f'))"; then
              echo "  [OK] $f"
            else
              echo "  [FAIL] $f"
              errors=$((errors + 1))
            fi
          done < <(find .github ci -name '*.yml' -print0 2>/dev/null || true)
          if [ "$errors" -ne 0 ]; then
            echo "$errors YAML file(s) failed to parse!"
            exit 1
          fi
