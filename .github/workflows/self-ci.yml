name: Self CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:

    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      # v1.4.0 committed CRLF into 84 files (renormalization run with
      # core.autocrlf=true and an incomplete .gitattributes). bash -n and
      # PyYAML both tolerate CRLF, so neither job below would have caught
      # it. Check committed blobs directly, bypassing any local
      # core.autocrlf smudging.
      - name: Check for CRLF in committed blobs
        run: |
          errors=0
          while IFS= read -r f; do
            sha=$(git ls-files -s -- "$f" | awk '{print $2}')
            [ -z "$sha" ] && continue
            if git cat-file blob "$sha" | grep -qU $'\r$'; then
              echo "  [CRLF] $f"
              errors=$((errors + 1))
            fi
          done < <(git ls-files)
          if [ "$errors" -ne 0 ]; then
            echo "$errors file(s) have CRLF line endings in the committed blob!"
            exit 1
          fi

      # CI Sweeper deliverables gate (spec 017): the ci-triage skill and the
      # ci-sweeper workflow must carry every required string, and the gate must
      # fail closed. The --self-test run proves the gate rejects a broken
      # fixture. Not continue-on-error: a sweeper regression fails the job.
      - name: Check CI sweeper deliverables
        run: |
          ./scripts/check-ci-sweeper.sh
          ./scripts/check-ci-sweeper.sh --self-test

      - name: Check shell scripts parse (bash -n)
        run: |
          errors=0
          while IFS= read -r -d '' f; do
            if bash -n "$f"; then
              echo "  [OK] $f"
            else
              echo "  [FAIL] $f"
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          if [ "$errors" -ne 0 ]; then
            echo "$errors script(s) failed to parse!"
            exit 1
          fi

      - name: make validate-all
        run: make validate-all

      # Design-gate blame scoping (spec 011): scratch-repo tests for
      # check-code-principles.sh -BaseRef. A violation in any AC-011-02
      # assertion fails the job — no continue-on-error.
      - name: Check design-gate blame scoping (scratch repos)
        run: bash scripts/tests/check-code-principles-blame.sh

      # Gate consistency (verifiable single source of truth): the valid gate
      # list is defined once in scripts/check-code-principles.sh; the blame
      # test's expected error message and docs must match it. This check
      # would have caught the component-per-file addition that left the
      # hardcoded "complexity, dry, yagni, solid, property-tests" expectation
      # stale (PR #59 first push, 1/24 blame tests red).
      - name: Check gate list consistency
        run: bash scripts/check-gate-consistency.sh

      - name: Check orchestration references
        run: ./scripts/check-orchestration.sh

      # Vacuous-assertion gate: a bats test that would still pass with its
      # script under test replaced by `exit 0` is theatre, not coverage.
      # Also runs inside `make test-scripts`; named here so a failure is
      # legible without reading the test job's log. No continue-on-error.
      - name: Check bats assertions are not vacuous
        run: ./scripts/check-bats-assertions.sh

      # Phase-2 loop mechanics gate (docs/SPEC_PIPELINE.md §Post-PR CI
      # check-and-remediate loop (phase 2), spec 014): grep-assert the post-PR
      # CI check is wired into the pipeline prompts/docs. No continue-on-error.
      - name: Check post-PR CI loop mechanics
        run: ./scripts/check-post-pr-ci-loop.sh

      - name: Check skills specification
        run: ./scripts/check-skills.sh

      # Finished-spec gate (docs/SPEC_PIPELINE.md §Archive in the PR): a spec
      # with a 30-report.md must be archived (docs/changes/NNN-slug.md) inside
      # its PR. No continue-on-error: a finished spec that would land scratch
      # on main fails the job.
      - name: Check finished specs are archived
        run: ./scripts/check-specs-archived.sh

      # Audit-trail gate (docs/SPEC_PIPELINE.md §Audit contract): only *finished*
      # spec folders — those carrying a 30-report.md, the pipeline's finished
      # signal (same convention as the check-specs-archived.sh step above) —
      # must be complete (10-tasks.md, 20-acceptance/, 25-verification.md,
      # 30-report.md) and 25-verification.md must record per-check evidence.
      # In-flight sibling specs lack 30-report.md and are skipped: their pipeline
      # finishing is outside this job's control and must not turn this job red.
      # The gate script itself still fails an incomplete folder when it is
      # explicitly handed one (the PR Opener runs it per-spec before pushing;
      # AC-015-07..14 mandate that behavior) — this step simply never hands it an
      # unfinished folder. The step exits 0 when no finished spec exists. No
      # continue-on-error: a finished spec failing the audit-trail check fails
      # the job.
      - name: Check spec audit trails
        run: |
          set -euo pipefail
          errors=0
          for report in specs/*/30-report.md; do
            [ -f "$report" ] || continue
            slug=${report#specs/}
            slug=${slug%/30-report.md}
            echo "  [check] specs/$slug"
            ./scripts/check-audit-trail.sh "$slug" || errors=$((errors + 1))
          done
          if [ "$errors" -ne 0 ]; then
            echo "$errors finished spec folder(s) failed the audit-trail check!"
            exit 1
          fi

      - name: make lint
        run: make lint

      # Model-config gate (docs/SPEC_PIPELINE.md §Model configuration): the
      # hermetic check + selftest need no binary; the runtime check proves real
      # {env:SPEC_*_MODEL} resolution with the pinned opencode release. No
      # continue-on-error: a loader/gate/wiring regression fails the job.
      - name: Install pinned opencode binary and verify model env resolution
        run: |
          set -euo pipefail
          # Inline download (spec 020 AC-020-06-05 asserts the pinned tarball
          # URL lives in this workflow). Extract into its own dir: running a
          # binary at /tmp/opencode makes opencode try to mkdir its storage dir
          # at the same path → EEXIST.
          mkdir -p /tmp/opencode-bin
          curl -sSL -o /tmp/opencode-bin/opencode-linux-x64.tar.gz https://github.com/anomalyco/opencode/releases/download/v1.18.18/opencode-linux-x64.tar.gz
          tar -xzf /tmp/opencode-bin/opencode-linux-x64.tar.gz -C /tmp/opencode-bin
          /tmp/opencode-bin/opencode --version
          bash scripts/check-model-env.sh
          bash scripts/model-env.selftest.sh
          bash scripts/model-env.runtime-check.sh /tmp/opencode-bin/opencode

      # Agent local-env gates (spec 013): the guard refuses to track
      # config/agent.local.env, the hardcoded-secrets check scans the scoped
      # dirs (widened in spec 026, AC-026-09), and the selftests prove
      # loader/guard/check fire. No continue-on-error: a committed secret or
      # a gate regression fails the job.
      - name: Check agent env guard and hardcoded secrets
        run: |
          set -euo pipefail
          bash scripts/guard-env.sh
          bash scripts/check-no-hardcoded-secrets.sh
          bash scripts/check-no-hardcoded-secrets.sh --self-test
          bash scripts/agent-env.selftest.sh

      - name: Run loop files check
        run: ./scripts/check-loop-files.sh

      # Daily Triage loop gate (spec 019): the check script doubles as the
      # spec's test carrier, so a missing deliverable fails the Validate job.
      - name: Check Daily Triage loop deliverables
        run: ./scripts/check-loop-triage.sh

      # PR Babysitter loop gate (spec 018): the check script doubles as the
      # spec's test carrier, so a missing deliverable fails the Validate job.
      - name: Check PR Babysitter loop deliverables
        run: ./scripts/check-pr-babysitter.sh

      # PR review agent gate (spec 024): the check script doubles as the
      # spec's test carrier, so a missing deliverable fails the Validate job.
      - name: Check PR review agent deliverables
        run: |
          ./scripts/check-pr-review.sh
          ./scripts/check-pr-review.selftest.sh

      # Security-hardening gate (spec 026): the check script doubles as the
      # spec's test carrier for its thirteen findings — a regression in any
      # one of them (e.g. StrictHostKeyChecking=no creeping back in, a
      # secret-scan scope shrinking, an @main reference reappearing) fails
      # the Validate job. --self-test proves the gate itself fails closed.
      - name: Check security-hardening deliverables
        run: |
          ./scripts/check-security-hardening.sh
          ./scripts/check-security-hardening.sh --self-test

      - name: Check remediation budget
        run: ./scripts/check-remediation-budget.sh

      - name: Install shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: shellcheck scripts and templates
        continue-on-error: true
        run: |
          shellcheck scripts/*.sh templates/*.sh

      # Gate self-tests (spec 012): one deliberately-bad fixture per gate
      # proving each gate fires with the right severity, plus the traceability
      # and telemetry regression nets. No continue-on-error: a gate regression
      # (e.g. the complexity threshold raised so a fixture no longer fires)
      # fails the job. The principles selftest fail-fasts with a clear message
      # if 007's --gates flag is not yet merged — 012 lands in the same batch.
      - name: Install bats-core
        run: |
          set -euo pipefail
          if ! command -v bats >/dev/null 2>&1; then
            git -c core.autocrlf=false clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
            /tmp/bats-core/install.sh /tmp/bats-install
            echo "/tmp/bats-install/bin" >> "$GITHUB_PATH"
          fi
          /tmp/bats-install/bin/bats --version 2>/dev/null || bats --version

      - name: Run shell gate bats tests (spec 001 Track B)
        run: make test-scripts

      - name: Run gate selftests
        run: |
          set -euo pipefail
          bash scripts/check-code-principles.selftest.sh
          bash scripts/check-scenario-traceability.selftest.sh
          bash scripts/tests/gate-telemetry.selftest.sh

      # Live scenario-traceability check (spec 027, AC-027-02): the selftest
      # above only proves the checker's logic against hermetic fixtures — it
      # never ran against this repo's own specs/ + source tree, so a real
      # in-flight spec's dangling/untraced reference could ship unnoticed.
      # Safe to run unconditionally now that check-scenario-traceability.sh's
      # check 2 is scoped to in-flight specs/NNN-*/ folders only (spec 027) —
      # an archived spec's permanent, by-design AC-NNN-NN self-citations in
      # its surviving gate script no longer produce false-positive noise.
      # A no-op, exit 0, when no specs/ folder is present (the normal state
      # of main between spec PRs).
      - name: Check scenario traceability (live tree)
        run: bash scripts/check-scenario-traceability.sh

      # Note: this intentionally mirrors `make lint`'s YAML scope (.github + ci),
      # not full-repo. Expanding scope belongs in the Makefile, not here.
      - name: Validate YAML syntax (.github, ci)
        run: |
          errors=0
          while IFS= read -r -d '' f; do
            if python3 -c "import yaml; yaml.safe_load(open('$f'))"; then
              echo "  [OK] $f"
            else
              echo "  [FAIL] $f"
              errors=$((errors + 1))
            fi
          done < <(find .github ci -name '*.yml' -print0 2>/dev/null || true)
          if [ "$errors" -ne 0 ]; then
            echo "$errors YAML file(s) failed to parse!"
            exit 1
          fi
