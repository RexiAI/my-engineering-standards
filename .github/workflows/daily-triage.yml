# Daily Triage loop — spec 019
#
# This repo's first `on: schedule` workflow. Runs the L1 report-only triage
# loop per docs/LOOP_ENGINEERING.md §Readiness levels (016): a headless
# `opencode run` that triages open PRs, specs awaiting build or stuck at a
# gate, CI health, and unresolved open questions; writes outcomes to STATE.md;
# appends one loop-run-log.md entry; and notifies a human only when action is
# required. It makes no code change, opens no PR, and merges nothing.
#
# Scheduling note: GitHub Actions `schedule:` (cron) delivery is best-effort —
# there is no exact-time guarantee. Acceptable for a daily triage cadence.
# `workflow_dispatch` is also provided so the first run fires immediately and
# a human can re-run on demand.
#
# State persistence: this workflow commits STATE.md + loop-run-log.md to a
# dedicated `loop-state` branch — never to `main` (AGENTS.md: no direct push
# to main, no exceptions). The branch is created on the first run if absent.
#
# Provider credentials: the headless opencode run needs an API key for the
# providers configured in opencode.json. It is supplied as a GitHub
# Actions repository secret `OPENCODE_API_KEY`, exposed to the run as the
# `OPENCODE_API_KEY` env var those providers declare. The human
# must add this secret. When it is absent the workflow exits 0 with a
# "not configured" message instead of failing the branch.
name: Daily Triage

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read

jobs:
  triage:
    name: Daily Triage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0

      # Seed the two durable state files from origin/loop-state when they exist.
      # A missing loop-state branch on the first run is fine — the run creates
      # the files from the 016 templates / documented shapes.
      - name: Seed loop state from loop-state branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin loop-state > /dev/null 2>&1; then
            git fetch origin loop-state
            for f in STATE.md loop-run-log.md; do
              if git cat-file -e "origin/loop-state:$f" 2>/dev/null; then
                git show "origin/loop-state:$f" > "$f"
                echo "Seeded $f from origin/loop-state"
              fi
            done
          else
            echo "No origin/loop-state branch yet (first run) — will bootstrap from 016 templates/shapes."
          fi

      # Install the pinned opencode binary and sanity-check it. Same pinned
      # release + checksum the repo's other headless workflows use — via the
      # shared script (spec 026, AC-026-04): this step used to duplicate the
      # download inline with no checksum verification and no version-drift
      # protection (the exact bug class scripts/install-opencode.sh's own
      # header warns other workflows about — this one just hadn't been wired
      # to it yet).
      - name: Install opencode
        run: bash scripts/install-opencode.sh

      # The workflow never creates or edits the notification issue — that is
      # the run's job (the skill instructs creating or updating the issue via
      # gh only when ACTION_REQUIRED). This step only guards the credential.
      - name: Check provider key is configured
        id: provider-check
        run: |
          if [ -z "${OPENCODE_API_KEY:-}" ]; then
            echo "::warning::Daily Triage not configured: the OPENCODE_API_KEY secret is absent. Skipping the run."
            echo "not-configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      # Headless triage run. The prompt names the skill and instructs reading
      # it first. Not passed --auto; the run's edit/write scope comes from the
      # skill's allowed-tools (STATE.md, loop-run-log.md, loop-budget.md only).
      - name: Run daily triage loop
        if: steps.provider-check.outputs.not-configured != 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # The skill's mandated `gh` calls — the loop-pause-all kill-switch
          # label check, issue create/comment, PR and workflow-run inspection —
          # authenticate from GH_TOKEN. Without it every one of them fails, and
          # the loop has only been working by accident: it recovers the job
          # token from the git credentials actions/checkout persists. A
          # `persist-credentials: false` hardening pass would silently remove
          # that recovery and break the kill-switch check with it (issues #71
          # and #77 item 3). Wiring the token explicitly removes the accident.
          # The `permissions:` block above already grants contents/issues write
          # and pull-requests/actions read, which is what these calls need, so
          # no permission change is required.
          GH_TOKEN: ${{ github.token }}
        run: |
          /tmp/opencode-bin/opencode run \
            --dir "$GITHUB_WORKSPACE" \
            "Read skills/loop-triage/SKILL.md first and follow it exactly for this run of the Daily Triage loop."

      # Persist state to loop-state. Staging is limited to the two state files;
      # any other change fails the workflow (report-only enforcement). Pushes to
      # loop-state, never to main. Skips the commit when neither file changed.
      #
      # The commit is parented on origin/loop-state, NOT on main. loop-state
      # forked from main at 56e2b77 (2026-08-20) and carries its own state
      # commits, so a commit whose parent chain runs through main is always a
      # non-fast-forward push to loop-state and is rejected outright. That
      # rejection is why the loop silently lost STATE.md and loop-run-log.md on
      # every run since 2026-08-21 — issue #77 records 38+ consecutive failures
      # and loop-state frozen at 1e019c5 for ~57 days. Parenting on loop-state
      # makes every push a fast-forward. Never --force, never to main.
      - name: Commit and push state to loop-state
        if: steps.provider-check.outputs.not-configured != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Report-only: any change outside the two state files is a violation.
          other=$(git status --porcelain | grep -vE '^\?\? (STATE\.md|loop-run-log\.md)$|^ M (STATE\.md|loop-run-log\.md)$' || true)
          if [ -n "$other" ]; then
            echo "ERROR: the run modified files other than STATE.md and loop-run-log.md:"
            echo "$other"
            exit 1
          fi
          # Park the run's state outside the repo. Checking out loop-state
          # replaces the working tree with that branch's older snapshot, so the
          # freshly written state would otherwise be clobbered.
          run_state="$(mktemp -d)"
          for f in STATE.md loop-run-log.md; do
            [ -f "$f" ] && cp "$f" "$run_state/$f"
          done
          git checkout -- STATE.md loop-run-log.md 2>/dev/null || true
          rm -f STATE.md loop-run-log.md

          if git ls-remote --exit-code origin loop-state >/dev/null 2>&1; then
            git fetch -q origin loop-state
            git checkout -q -B loop-state-run FETCH_HEAD
          else
            # First run ever: branch from the current tree so loop-state starts
            # with the same shape later runs expect.
            echo "No origin/loop-state yet - bootstrapping from the current tree."
            git checkout -q -b loop-state-run
          fi

          for f in STATE.md loop-run-log.md; do
            [ -f "$run_state/$f" ] && cp "$run_state/$f" "$f"
          done
          rm -rf "$run_state"

          git add STATE.md loop-run-log.md
          # Compared against loop-state's own content now, which is the
          # meaningful baseline: a run that rewrites the same state should not
          # produce an empty commit.
          if git diff --cached --quiet; then
            echo "No state changes relative to loop-state; skipping commit."
            exit 0
          fi
          git commit -q -m "chore(loop): daily triage state update"
          # Fast-forward push to loop-state only. Never main, never --force.
          git push origin HEAD:loop-state
