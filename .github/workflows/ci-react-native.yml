name: CI - React Native (Expo)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version. Ignored if node-version-file is set. Kept for backward compat with consumers that don't have an .nvmrc yet.
        default: "22"
        type: string
      node-version-file:
        description: Path to the file declaring the Node version (e.g. .nvmrc). Takes priority over node-version when set — new consumers should set this instead of pinning a version here.
        default: ""
        type: string
    secrets:
      EXPO_TOKEN:
        description: Expo access token for EAS builds. Only used by the eas-build job, which is gated on a push to the default branch.
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-checks:
    name: Structural Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        # Child repos consume these scripts via the .standards submodule.
        with:
          submodules: true
      - name: Structural checks (phase 1)
        run: |
          script=".standards/scripts/ci-smoke-test.sh"
          [ -f "$script" ] || script="scripts/ci-smoke-test.sh"
          bash "$script" --phase 1

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npm test -- --passWithNoTests 2>/dev/null || npm run test:unit --if-present || npm test

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run format:check --if-present

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Export Bundle
    needs: [unit-test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: npx expo export
        working-directory: app

  eas-build:
    name: EAS Build
    needs: [unit-test, lint, build]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      # Honest skip when the project does not use EAS: eas build without an
      # app/eas.json project config cannot succeed, and modern eas-cli
      # rejects --platform web outright. Gate lives at step level because
      # hashFiles/file checks are unavailable in job-level if:.
      - name: Detect EAS configuration
        id: gate
        run: |
          echo "eas-configured=$([ -f app/eas.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.eas-configured == 'true'
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.eas-configured == 'true'
      - run: npm ci
        if: steps.gate.outputs.eas-configured == 'true'
        working-directory: app
      - run: npx eas-cli build --non-interactive --platform all
        if: steps.gate.outputs.eas-configured == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
