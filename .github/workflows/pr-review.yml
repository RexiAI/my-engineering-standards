name: PR Review Agent

# This repo's own trigger for the shared PR review workflow (spec 024,
# self-hosting proof): the same reusable workflow child repos opt into via
# init-ci.sh --with-pr-review runs on this repo's PRs.
#
# Per-PR concurrency with cancel-in-progress: only the latest head gets a live
# review — a superseded run on an older head cancels.
#
# Secret-guarded: without the API key the job is skipped (check state
# "skipped", never "failure"), so the PR's required checks are unaffected.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR
    # Self-hosting calls the local reusable workflow: same revision as this
    # trigger, so the repo's own PRs exercise the workflow exactly as shipped.
    # Child repos generated by init-ci.sh keep a SHA-pinned remote reference.
    uses: ./.github/workflows/ci-pr-review.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
