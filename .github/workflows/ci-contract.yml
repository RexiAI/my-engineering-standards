name: Contract Tests (Pact)

on:
  workflow_call:
    inputs:
      language:
        description: Language runtime (java|go|node)
        default: node
        type: string
    secrets:
      PACT_BROKER_URL:
        description: Pact Broker URL
        required: false
      PACT_BROKER_TOKEN:
        description: Pact Broker auth token
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pact-verify:
    name: Pact Provider Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Setup Java
        if: inputs.language == 'java'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: corretto
          java-version-file: .java-version
          cache: maven
      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Node
        if: inputs.language == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Java — Run Pact verification
        if: inputs.language == 'java'
        run: mvn pact:verify -B 2>/dev/null || echo "No contract tests configured"
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
      - name: Go — Run Pact verification
        if: inputs.language == 'go'
        run: make test-contract 2>/dev/null || echo "No contract tests configured"
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
      - name: Node — Run Pact verification
        if: inputs.language == 'node'
        run: npx jest test/pact --ci --forceExit 2>/dev/null || npm run test:pact --if-present || echo "No contract tests configured"
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
