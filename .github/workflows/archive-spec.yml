name: Archive spec on merge

# Fires when a spec pipeline PR is merged to main. Extracts the slug from the
# PR's source branch (spec/NNN-slug), runs scripts/archive-spec.sh to write a
# one-pager to docs/changes/, removes the spec folder, and commits the result.
#
# No-op for non-spec PRs (branch doesn't match spec/NNN-slug) and for spec
# branches whose spec folder is already gone (tooling PRs, follow-ups).
#
# Standards reference: docs/SPEC_PIPELINE.md §Archive on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  archive:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract spec slug from branch name
        id: slug
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ "$BRANCH" =~ ^spec/([0-9]{3}-.+) ]]; then
            echo "slug=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Spec slug: ${BASH_REMATCH[1]}"
          else
            echo "Branch '$BRANCH' is not a spec/NNN-slug branch — nothing to archive."
            echo "slug=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run archive-spec.sh
        if: steps.slug.outputs.slug != ''
        run: |
          chmod +x ./scripts/archive-spec.sh
          SLUG="${{ steps.slug.outputs.slug }}"
          if [ -d "specs/$SLUG" ]; then
            ./scripts/archive-spec.sh "$SLUG"
          else
            echo "No specs/$SLUG/ folder — nothing to archive (PR shipped tooling, not a feature spec)."
          fi

      - name: Detect changes
        id: changes
        if: steps.slug.outputs.slug != ''
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.slug.outputs.slug != '' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(changes): archive ${{ steps.slug.outputs.slug }}"
          git push
