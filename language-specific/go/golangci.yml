# Wired via `make lint` -> golangci-lint run ./... (see docs/CI_CD.md, language-specific/go/SKILL.md §Commands).
#
# KNOWN ISSUE (found via docs/SPEC_PIPELINE.md live-fire testing, not yet fixed):
# this file has not been fully migrated to golangci-lint v2 linter names. Verified
# broken as of golangci-lint 2.12.2:
#   - gofmt/gci/goimports under linters.enable — v2 moved these to formatters-only,
#     `gofmt` in linters.enable errors ("gofmt is a formatter"); gci/goimports
#     status unverified past that point.
#   - gosimple/stylecheck — merged into staticcheck in v2, "unknown linters" error.
# `typecheck` (also invalid in v2, "not a linter") has been removed below as part
# of adding the cyclop/gocognit complexity gate. The rest is a separate, larger
# migration — track and fix independently of docs/SPEC_PIPELINE.md.
version: 2

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - asciicheck
    - bodyclose
    - containedctx
    - contextcheck
    - cyclop
    - decorder
    - dupl
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocognit
    - gocritic
    - gofmt
    - gci
    - goimports
    - gosec
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - stylecheck
    - usetesting
    - thelper
    - unconvert
    - unparam
    - whitespace
  settings:
    gci:
      local-prefixes: github.com/company
    goconst:
      min-len: 3
      min-occurrences: 3
    # Refactorer stage target: <=6, see docs/SPEC_PIPELINE.md §Tooling by language.
    cyclop:
      max-complexity: 6
    gocognit:
      min-complexity: 6
    misspell:
      locale: US
    gosec:
      # Widen, don't narrow: report low-confidence findings too. The usual
      # tuning direction for gosec is to raise this to cut noise; the
      # opposite call is deliberate here — a missed low-confidence hit costs
      # more than an extra false positive to triage.
      confidence: low

issues:
  # Defaults (50 / 3) silently hide work and turn "fix lint" into an
  # unbounded loop where the count never seems to go down. No ceiling.
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - bodyclose
        - noctx
        - errcheck
        - gosec
        - gochecknoglobals
        - gochecknoinits
        - cyclop
        - gocognit

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes: github.com/company
