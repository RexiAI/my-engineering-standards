# NOTE: not referenced by language-specific/go/AGENTS.md's command table (no
# `make lint` entry documents golangci-lint). Verify wiring before assuming this runs anywhere.
version: 2

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - asciicheck
    - bodyclose
    - containedctx
    - contextcheck
    - decorder
    - dupl
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - goconst
    - gocritic
    - gofmt
    - gci
    - goimports
    - gosec
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - stylecheck
    - usetesting
    - thelper
    - unconvert
    - unparam
    - whitespace
  settings:
    gci:
      local-prefixes: github.com/company
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - bodyclose
        - noctx
