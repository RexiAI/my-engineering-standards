# Generated CI for Java project
# Template: ci/templates/child-ci-java.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: pucelano-95/my-engineering-standards/.github/workflows/backend/ci-java.yml@main
    with:
      java-version: "21"
      deploy-on-main: true
      docker-registry: DOCKER_REGISTRY
      # Set to true if this service uses the Saga or Outbox pattern.
      # Enables saga-quality-gates job: ArchUnit rules, outbox schema lint,
      # timeout enforcement, and integration test presence checks.
      # See docs/SAGA_PATTERN.md §CI Quality Gates, docs/OUTBOX_PATTERN.md §CI Quality Gates
      with-saga-gates: false
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
