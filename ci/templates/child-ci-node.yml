# Generated CI for Node.js project
# Template: ci/templates/child-ci-node.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: RexiAI/my-engineering-standards/.github/workflows/ci-node.yml@21046d96796467f8238d6d613ce3a552bf3fced0 # pinned; bump deliberately, never track a branch
    with:
      node-version: "22"
      deploy-on-main: true
      docker-registry: DOCKER_REGISTRY
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
