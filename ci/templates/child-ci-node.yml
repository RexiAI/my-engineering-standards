# Generated CI for Node.js project
# Template: ci/templates/child-ci-node.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: pucelano-95/my-engineering-standards/.github/workflows/backend/ci-node.yml@main
    with:
      node-version: "22"
      deploy-on-main: true
      docker-registry: DOCKER_REGISTRY
      # Set to true if this service uses the Saga or Outbox pattern.
      # Enables saga-quality-gates job: ESLint saga rules, outbox schema lint,
      # timeout enforcement, and integration test presence checks.
      # See docs/SAGA_PATTERN.md §CI Quality Gates, docs/OUTBOX_PATTERN.md §CI Quality Gates
      with-saga-gates: false
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
