# Pact contract testing setup for Java (Maven)
# Copy this into your <project>/pom.xml's <build><plugins> section
#
# Usage:
#   mvn pact:verify     ← runs provider-side verification
#   mvn pact:publish    ← publishes pacts to broker
#
# Requires a running Pact broker (see ci/templates/pact-broker-local.yml)

# Add to pom.xml:
