# Java CI jobs for GitLab — include from child .gitlab-ci.yml
# Usage:
#   include:
#     - local: .standards/ci/gitlab/backend/ci-java.yml

.java-variables:
  variables:
    JAVA_VERSION: "21"
    MAVEN_CLI_OPTS: "-B -s .m2/settings.xml"
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

.java-cache:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
    policy: pull-push

.java-setup:
  image: maven:${JAVA_VERSION}-eclipse-temurin
  tags: [docker]

.java-unit:
  extends: [.java-setup, .java-cache]
  variables:
    MAVEN_GOAL: "test"
  script:
    - mvn ${MAVEN_CLI_OPTS} ${MAVEN_GOAL}

.java-lint:
  extends: [.java-setup, .java-cache]
  script:
    - mvn ${MAVEN_CLI_OPTS} spotless:check

.java-saga-gates:
  extends: [.java-setup, .java-cache]
  script:
    - |
      STANDARDS="${CI_PROJECT_DIR}/.standards"
      source "${STANDARDS}/scripts/detect-saga-outbox.sh" --gitlab-dotenv saga-env.env

      if [ "${SAGA_DETECTED}" = "true" ] || [ "${OUTBOX_DETECTED}" = "true" ]; then
        echo "=== Saga/Outbox gates: pattern detected, running checks ==="

        if [ "${OUTBOX_DETECTED}" = "true" ]; then
          bash "${STANDARDS}/scripts/lint-outbox-schema.sh"
          bash "${STANDARDS}/scripts/check-outbox-relay.sh"
        fi

        if [ "${SAGA_DETECTED}" = "true" ]; then
          bash "${STANDARDS}/scripts/check-saga-timeouts.sh"
        fi

        SAGA_DETECTED="${SAGA_DETECTED}" OUTBOX_DETECTED="${OUTBOX_DETECTED}" \
          bash "${STANDARDS}/scripts/check-saga-tests.sh"

        # ArchUnit rules — run if saga-archunit-rules dep is in pom.xml.
        # Exits non-zero on ArchUnit violations (CI gate fails) or if no matching tests found.
        # Add dependency from ci/templates/archunit/pom-fragment.xml to enable.
        if mvn ${MAVEN_CLI_OPTS} test -pl . \
            -Dtest="*ArchTest,*SagaArchTest,*OutboxArchTest" \
            --fail-at-end -q 2>&1 | grep -q 'No tests were found'; then
          echo "WARN: No ArchUnit tests found. Add SagaArchRules/OutboxArchRules — see ci/templates/archunit/"
        fi
      else
        echo "=== Saga/Outbox gates: no saga/outbox patterns detected, skipping ==="
      fi
  artifacts:
    reports:
      dotenv: saga-env.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: false

.java-contract:
  extends: [.java-setup, .java-cache]
  script:
    - mvn pact:verify -B 2>/dev/null || echo "No contract tests configured"
  variables:
    PACT_BROKER_URL: ${PACT_BROKER_URL:-""}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.java-integration:
  extends: [.java-setup, .java-cache]
  variables:
    MAVEN_GOAL: "verify"
  script:
    - mvn ${MAVEN_CLI_OPTS} ${MAVEN_GOAL} -DskipITs=false -DskipTests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.java-deploy:
  extends: [.java-setup]
  script:
    - mvn clean deploy ${MAVEN_CLI_OPTS} -DskipTests -DskipITs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.java-docker:
  extends: [.java-setup]
  script:
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} ${CI_REGISTRY_IMAGE}:latest
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${CI_REGISTRY_IMAGE}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
