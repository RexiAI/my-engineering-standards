# Go CI jobs for GitLab — include from child .gitlab-ci.yml
# Usage:
#   include:
#     - local: .standards/ci/gitlab/backend/ci-go.yml

.go-variables:
  variables:
    GO_VERSION: "1.26"

.go-cache:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - go/pkg/mod/
    policy: pull-push

.go-setup:
  image: golang:${GO_VERSION}
  tags: [docker]
  before_script:
    - go mod download

.go-unit:
  extends: [.go-setup, .go-cache]
  script:
    - make test

.go-lint:
  extends: [.go-setup, .go-cache]
  script:
    - make lint

.go-saga-gates:
  extends: [.go-setup, .go-cache]
  script:
    - |
      STANDARDS="${CI_PROJECT_DIR}/.standards"
      source "${STANDARDS}/scripts/detect-saga-outbox.sh" --gitlab-dotenv saga-env.env

      if [ "${SAGA_DETECTED}" = "true" ] || [ "${OUTBOX_DETECTED}" = "true" ]; then
        echo "=== Saga/Outbox gates: pattern detected, running checks ==="

        if [ "${OUTBOX_DETECTED}" = "true" ]; then
          bash "${STANDARDS}/scripts/lint-outbox-schema.sh"
          bash "${STANDARDS}/scripts/check-outbox-relay.sh"
        fi

        if [ "${SAGA_DETECTED}" = "true" ]; then
          bash "${STANDARDS}/scripts/check-saga-timeouts.sh"
          # Go AST saga linter
          go run "${STANDARDS}/ci/templates/go-saga-lint.go" ./...
        fi

        SAGA_DETECTED="${SAGA_DETECTED}" OUTBOX_DETECTED="${OUTBOX_DETECTED}" \
          bash "${STANDARDS}/scripts/check-saga-tests.sh"
      else
        echo "=== Saga/Outbox gates: no saga/outbox patterns detected, skipping ==="
      fi
  artifacts:
    reports:
      dotenv: saga-env.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: false

.go-contract:
  extends: [.go-setup, .go-cache]
  script:
    - make test-contract 2>/dev/null || echo "No contract tests configured"
  variables:
    PACT_BROKER_URL: ${PACT_BROKER_URL:-""}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.go-integration:
  extends: [.go-setup, .go-cache]
  script:
    - make test-integration
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.go-deploy:
  extends: [.go-setup]
  script:
    - make build
  artifacts:
    paths:
      - ./bin/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.go-docker:
  extends: [.go-setup]
  script:
    - make docker
    - docker tag ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} ${CI_REGISTRY_IMAGE}:latest
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${CI_REGISTRY_IMAGE}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
