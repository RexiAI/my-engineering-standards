# systemd override for the ollama service — flash attention + q8_0 KV cache +
# the empirically selected context length (spec 001-ollama-context).
#
# Provenance of OLLAMA_CONTEXT_LENGTH:
#   Value 16384 is the summary `selected` value from the Task 1 empirical
#   benchmark report (specs/001-ollama-context/benchmark-report.csv), produced by
#   scripts/benchmark-ollama-context.sh against qwen3.8:27b on this machine via
#   the /v1/chat/completions endpoint (the one opencode uses). The benchmark
#   measured num_ctx 16384 / 32768 / 49152 / 65536; 16384 was the largest row with
#   probe_result=PASS, size_vram_gib <= 16.0 (16.3 - 0.3 headroom), and
#   tokens_per_sec >= 15. The higher contexts reported INVALID because the
#   /v1/chat/completions endpoint is capped at the server's OLLAMA_CONTEXT_LENGTH
#   default and does not honor a per-request num_ctx above it on this server.
#   This value is read from the report, never invented.
#
# Flash attention + q8_0 KV cache are enabled so the same context fits in less
# VRAM (a conservative baseline was selected; these only reduce KV VRAM).
#
# Apply with:
#   sudo install -m 0644 templates/ollama.service.d/context.conf \
#     /etc/systemd/system/ollama.service.d/context.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#   scripts/check-ollama-override.sh
[Service]
Environment="OLLAMA_CONTEXT_LENGTH=16384"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
