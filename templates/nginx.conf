# Nginx reverse proxy with TLS — for the raw SSH + Docker Compose backend.
# Copy to repo root as nginx.conf and adjust the server_name and proxy_pass.
# Used by templates/setup-host.sh --backend ssh.
#
# setup-host.sh installs this at /etc/nginx/sites-available/<service> and
# symlinks it into /etc/nginx/sites-enabled/, then runs certbot to obtain
# the Let's Encrypt certificate.

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name example.com;   # ← replace with your domain (APP_DOMAIN)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — reverse proxy to the app container
server {
    listen 443 ssl;
    server_name example.com;   # ← replace with your domain (APP_DOMAIN)

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Recommended TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;   # ← container's published host port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
